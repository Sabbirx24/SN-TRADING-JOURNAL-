<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Trading Journal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
:root{
  --bg:#0b0b10;
  --card:#16161d;
  --card2:#1c1c25;
  --text:#e5e7eb;
  --muted:#9ca3af;
  --green:#22c55e;
  --red:#ef4444;
  --border:#2a2a35;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Inter,system-ui,sans-serif;
  background:#0b0b10;
  color:var(--text);
}
.hidden{display:none}
.container{max-width:1200px;margin:auto;padding:30px}
h1{text-align:center}
button{
  background:#111;
  border:1px solid var(--border);
  color:var(--text);
  padding:6px 12px;
  border-radius:6px;
  cursor:pointer;
}
button:hover{border-color:var(--green)}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:20px;
  background:#0f0f15;
}
th,td{
  padding:10px;
  border:1px solid var(--border);
  font-size:13px;
  text-align:center;
}
th{color:var(--muted);background:#14141c}
.long{color:var(--green);font-weight:600}
.short{color:var(--red);font-weight:600}
.win{color:var(--green)}
.loss{color:var(--red)}
input,select{
  background:#0f0f15;
  border:1px solid var(--border);
  color:var(--text);
  padding:6px;
  border-radius:6px;
  font-size:12px;
  width:100%;
}
.form{
  display:grid;
  grid-template-columns:repeat(8,1fr) auto;
  gap:8px;
  margin-top:20px;
}
</style>
</head>
<body>

<div id="home" class="container">
  <h1>Trading Journals</h1>
  <p style="text-align:center;color:#9ca3af">Choose a month to open your journal</p>

  <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:20px;margin-top:30px">
    <div onclick="openJournal('Futures','January 2026')" style="cursor:pointer;background:#16161d;border:1px solid #2a2a35;border-radius:14px;padding:24px;text-align:center">
      <h2>January</h2><p>2026</p><small>Futures</small>
    </div>
    <div onclick="openJournal('Futures','December 2025')" style="cursor:pointer;background:#16161d;border:1px solid #2a2a35;border-radius:14px;padding:24px;text-align:center">
      <h2>December</h2><p>2025</p><small>Futures</small>
    </div>
    <div onclick="openJournal('Spot','December 2025')" style="cursor:pointer;background:#16161d;border:1px solid #2a2a35;border-radius:14px;padding:24px;text-align:center">
      <h2>December</h2><p>2025</p><small>Spot</small>
    </div>
  </div>
</div>

<div id="journal" class="container hidden">
  <button onclick="goBack()">← Back</button>
  <h1 id="title"></h1>

  <form class="form" onsubmit="addTrade(event)">
    <input type="date" id="date" required>
    <input placeholder="Pair" id="pair" required>
    <select id="direction"><option>Long</option><option>Short</option></select>
    <input placeholder="Lev" id="lev" required>
    <select id="result"><option>TP</option><option>SL</option><option>BE</option></select>
    <input placeholder="R.R.R" id="rrr">
    <input placeholder="PnL %" id="pnl">
    <input placeholder="Reason" id="reason">
    <button>Add</button>
  </form>

  <table>
    <thead>
      <tr>
        <th>Date</th><th>Pair</th><th>Dir</th><th>Lev</th>
        <th>Result</th><th>R.R.R</th><th>PnL %</th><th>Reason</th><th>Actions</th>
      </tr>
    </thead>
    <tbody id="rows"></tbody>
  </table>
</div>

<script>
let data = JSON.parse(localStorage.getItem('journals')) || {};
let currentKey = '';

function openJournal(market, month){
  currentKey = market+'_'+month;
  if(!data[currentKey]) data[currentKey] = [];
  title.textContent = market+' — '+month;
  home.classList.add('hidden');
  journal.classList.remove('hidden');
  render();
}
function goBack(){journal.classList.add('hidden');home.classList.remove('hidden');}
function save(){localStorage.setItem('journals',JSON.stringify(data));}

function render(){
  rows.innerHTML='';
  data[currentKey].forEach((t,i)=>{
    rows.innerHTML+=`
    <tr>
      <td><input value="${t.date}" onchange="edit(${i},'date',this.value)"></td>
      <td><input value="${t.pair}" onchange="edit(${i},'pair',this.value)"></td>
      <td>
        <select onchange="edit(${i},'direction',this.value)">
          <option ${t.direction==='Long'?'selected':''}>Long</option>
          <option ${t.direction==='Short'?'selected':''}>Short</option>
        </select>
      </td>
      <td><input value="${t.lev}" onchange="edit(${i},'lev',this.value)"></td>
      <td>
        <select onchange="edit(${i},'result',this.value)">
          <option ${t.result==='TP'?'selected':''}>TP</option>
          <option ${t.result==='SL'?'selected':''}>SL</option>
          <option ${t.result==='BE'?'selected':''}>BE</option>
        </select>
      </td>
      <td><input value="${t.rrr}" onchange="edit(${i},'rrr',this.value)"></td>
      <td><input value="${t.pnl}" onchange="edit(${i},'pnl',this.value)"></td>
      <td><input value="${t.reason}" onchange="edit(${i},'reason',this.value)"></td>
      <td><button onclick="del(${i})">✕</button></td>
    </tr>`;
  });
}

function addTrade(e){
  e.preventDefault();
  data[currentKey].push({
    date:date.value,pair:pair.value,direction:direction.value,lev:lev.value,
    result:result.value,rrr:rrr.value,pnl:pnl.value,reason:reason.value
  });
  save(); e.target.reset(); render();
}
function edit(i,key,val){data[currentKey][i][key]=val;save();}
function del(i){data[currentKey].splice(i,1);save();render();}
</script>
</body>
</html>
